<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VeriAI Systems</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #0f172a;
      color: #e2e8f0;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gate {
      width: 100%;
      max-width: 360px;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .logo-mark {
      width: 40px;
      height: 40px;
      background: #2563eb;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-mark svg {
      width: 22px;
      height: 22px;
      stroke: #fff;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .logo-name {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #f1f5f9;
      text-transform: uppercase;
    }

    .logo-name span { color: #3b82f6; }

    .label {
      font-size: 0.65rem;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      text-align: center;
    }

    .field {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input[type="password"] {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 0.9rem;
      color: #e2e8f0;
      outline: none;
      transition: border-color 0.15s;
      letter-spacing: 0.1em;
    }

    input[type="password"]:focus {
      border-color: #3b82f6;
    }

    input[type="password"]::placeholder {
      color: #475569;
      letter-spacing: 0.05em;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: #3b82f6; }
    button:active { background: #1d4ed8; }

    .error {
      font-size: 0.7rem;
      color: #f87171;
      letter-spacing: 0.08em;
      text-align: center;
      min-height: 1em;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .error.visible { opacity: 1; }

    .hint {
      font-size: 0.6rem;
      color: #1e293b;
      text-align: center;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="gate">
    <div class="logo">
      <div class="logo-mark">
        <!-- shield-check icon -->
        <svg viewBox="0 0 24 24">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <polyline points="9 12 11 14 15 10"/>
        </svg>
      </div>
      <div class="logo-name">VeriAI <span>Systems</span></div>
    </div>

    <div class="label">Restricted access — authorized users only</div>

    <div class="field">
      <input
        type="password"
        id="pwd"
        placeholder="Access key"
        autocomplete="current-password"
        autofocus
      />
      <button onclick="attempt()">Enter</button>
      <div class="error" id="err">Incorrect access key</div>
    </div>

    <div class="hint">VeriAI Systems · Prototype</div>
  </div>

  <script>
    // Base64-encoded password. Decode: atob('dmVyaWFpc3lzdGVtczIwMjY=') === 'veriaisystems2026'
    const ENCODED = 'dmVyaWFpc3lzdGVtczIwMjY=';

    // Auto-redirect if already authenticated
    if (localStorage.getItem('auth') === 'ok') {
      window.location.replace('pages/index.html');
    }

    function attempt() {
      const input = document.getElementById('pwd').value;
      if (btoa(input) === ENCODED) {
        localStorage.setItem('auth', 'ok');
        window.location.replace('pages/index.html');
      } else {
        const err = document.getElementById('err');
        err.classList.add('visible');
        document.getElementById('pwd').value = '';
        document.getElementById('pwd').focus();
        setTimeout(() => err.classList.remove('visible'), 3000);
      }
    }

    document.getElementById('pwd').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') attempt();
    });
  </script>
</body>
</html>
