<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0f1a; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .tag { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #475569; text-transform: uppercase; letter-spacing: .15em; margin-bottom: 8px; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border-radius: 4px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: background .15s; }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-primary:hover { background: #3b82f6; }
  .btn-ghost   { background: transparent; color: #cbd5e1; border: 1px solid #334155; }
  .btn-ghost:hover { border-color: #3b82f6; color: #fff; }
  .btn-mono    { background: #2563eb; color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; padding: 10px 18px; }
  .btn-sm      { padding: 6px 12px; font-size: 11px; }
  .btn-disabled{ background: #1e293b; color: #475569; cursor: not-allowed; }

  .divider { height: 1px; background: #1e293b; width: 100%; }
</style>
</head>
<body>
  <div class="tag">Primary Actions</div>
  <div class="row">
    <button class="btn btn-primary">Explore Platform</button>
    <button class="btn btn-primary" style="background:#3b82f6">Hover State</button>
    <button class="btn btn-primary" style="background:#1d4ed8">Active State</button>
    <button class="btn btn-primary btn-disabled btn-sm" disabled>Disabled</button>
  </div>

  <div class="divider"></div>
  <div class="tag">Ghost / Outline</div>
  <div class="row">
    <button class="btn btn-ghost">View Products</button>
    <button class="btn btn-ghost" style="border-color:#3b82f6; color:#fff;">Hover State</button>
  </div>

  <div class="divider"></div>
  <div class="tag">Mono / Gate Button</div>
  <div class="row">
    <button class="btn btn-mono">Enter</button>
    <button class="btn btn-mono" style="background:#3b82f6">Hover</button>
  </div>

  <div class="divider"></div>
  <div class="tag">With Icon</div>
  <div class="row">
    <button class="btn btn-primary" style="gap:6px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5,3 19,12 5,21"/></svg>
      Verify Behavior
    </button>
    <button class="btn btn-ghost btn-sm">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      Cancel
    </button>
  </div>
</body>
</html>
