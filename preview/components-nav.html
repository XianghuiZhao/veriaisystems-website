<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0f1a; }

  nav {
    background: rgba(10,15,26,.95);
    border-bottom: 1px solid #1e293b;
    backdrop-filter: blur(12px);
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
  }
  .logo { display: flex; align-items: center; gap: 8px; }
  .logo-mark { width: 28px; height: 28px; background: #2563eb; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
  .logo-mark svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .logo-name { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #f1f5f9; }
  .logo-name span { color: #3b82f6; }

  .nav-links { display: flex; gap: 28px; }
  .nav-link { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #64748b; letter-spacing: .05em; text-decoration: none; transition: color .15s; }
  .nav-link:hover, .nav-link.active { color: #f1f5f9; }

  .nav-controls { display: flex; align-items: center; gap: 6px; }
  .lang-btns { display: flex; align-items: center; gap: 4px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #64748b; margin-right: 6px; }
  .lang-btns span { color: #1e293b; }
  .icon-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: transparent; border: none; cursor: pointer; color: #64748b; }
  .icon-btn:hover { background: #1e293b; color: #cbd5e1; }
  .icon-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .note { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #334155; padding: 8px 24px; text-transform: uppercase; letter-spacing: .1em; }
</style>
</head>
<body>
  <nav>
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
      </div>
      <div class="logo-name">VeriAI <span>Systems</span></div>
    </div>

    <div class="nav-links">
      <a class="nav-link" href="#">Platform</a>
      <a class="nav-link active" href="#">Products</a>
    </div>

    <div class="nav-controls">
      <div class="lang-btns">
        <span style="color:#3b82f6">EN</span>
        <span>/</span>
        <span>DE</span>
        <span>/</span>
        <span>中文</span>
      </div>
      <button class="icon-btn">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      <button class="icon-btn">
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </button>
    </div>
  </nav>
  <div class="note">Fixed top navbar · height 56px · backdrop-blur · dark mode default</div>
</body>
</html>
