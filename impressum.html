<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <script>if(localStorage.getItem('theme')==='light')document.documentElement.classList.remove('dark');</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legal Notice | VeriAI Systems</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'], mono: ['JetBrains Mono','monospace'] } } }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body class="bg-white dark:bg-[#0a0f1a] text-slate-900 dark:text-slate-200 min-h-screen transition-colors duration-200">

  <div id="navbar-slot"></div>

  <main>
    <header class="pt-28 pb-12 px-6 border-b border-slate-200 dark:border-slate-800">
      <div class="max-w-2xl mx-auto">
        <p class="text-xs font-mono text-blue-500 uppercase tracking-[0.2em] mb-4">Legal</p>
        <h1 class="text-3xl font-extrabold tracking-tight mb-2">Legal Notice</h1>
        <p class="text-xs font-mono text-slate-400 dark:text-slate-600">
          Information in accordance with § 5 TMG (German Telemedia Act)
        </p>
      </div>
    </header>

    <section class="py-12 px-6">
      <div class="max-w-2xl mx-auto space-y-8 text-sm font-mono">

        <div>
          <p class="text-[10px] text-slate-400 dark:text-slate-600 uppercase tracking-widest mb-2">Contact</p>
          <p class="text-slate-700 dark:text-slate-300">
            E-Mail: <a href="mailto:info@veriai-systems.com"
                       class="text-blue-500 hover:text-blue-400 transition-colors">
              info@veriai-systems.com
            </a>
          </p>
        </div>

        <div class="pt-6 border-t border-slate-200 dark:border-slate-800">
          <p class="text-xs text-slate-400 dark:text-slate-600 leading-relaxed">
            This website represents an independent technical development project
            in the field of validation systems. No commercial services are
            currently offered.
          </p>
        </div>

        <div class="pt-2">
          <a href="/pages/index.html"
             class="flex items-center gap-2 text-xs text-slate-500 hover:text-blue-500 transition-colors">
            <i data-lucide="arrow-left" class="w-3 h-3"></i>
            Back to Home
          </a>
        </div>

      </div>
    </section>
  </main>

  <div id="footer-slot"></div>

  <script src="scripts/navigation.js"></script>
  <script>VeriAI.initPage({ auth: false });</script>
</body>
</html>
